name: smokeguard-frontend

services:
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    container_name: smokeguard-frontend
    restart: always
    ports:
      - '${FRONTEND_PORT:-8081}:80'
    networks:
      - smokeguard-frontend-network

networks:
  smokeguard-frontend-network:
    name: smokeguard-frontend-network
    driver: bridge
